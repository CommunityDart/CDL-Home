<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Dart Liga</title>

<style>
:root{
  --bg:#03131b;
  --panel:#041924;
  --line:rgba(120,170,195,.12);
  --text:#f5fbff;
  --muted:#90a9b7;
  --green:#3ddc97;
  --red:#e74c3c;
  --yellow:#f7c948;

  --accent:#20b7ff;
  --accent-border:rgba(32,183,255,.42);

  --row-a:#052130;
  --row-b:#041924;
}

body[data-mode="DartCounter"]{
  --accent:#ff9f1c;
  --accent-border:rgba(255,159,28,.42);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left, color-mix(in srgb, var(--accent) 14%, transparent), transparent 22%),
    linear-gradient(180deg, var(--bg) 0%, #021017 100%);
  color:var(--text);
  min-height:100vh;
}

.wrap{
  width:min(1400px, calc(100% - 28px));
  margin:0 auto;
  padding:8px 0 42px;
}

.hero-banner.image-banner{
  position:relative;
  margin:0 0 14px;
  min-height:320px;
  border-radius:30px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  background:url("banner.png") center center / cover no-repeat;
}

.top-nav-wrap{
  width:min(1200px, 100%);
  margin:0 auto 12px;
}

.banner-nav{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:12px;
  padding:12px;
  border-radius:22px;
  background:rgba(4,12,14,.22);
  border:1px solid rgba(255,255,255,.10);
}

.hero-action-btn{
  width:100%;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(6,20,30,.38);
  color:#fff;
  border-radius:16px;
  min-height:50px;
  padding:0 14px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

.hero-btn-autodarts{
  background:rgba(36,141,255,.20);
}

.hero-btn-dartcounter{
  background:rgba(255,154,31,.18);
}

.hero-btn-discord{
  background:rgba(88,101,242,.28);
}

.hero-btn-dark{
  background:rgba(3,19,27,.42);
}

.submenu-row{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:12px;
  margin-top:10px;
}

.submenu-slot{
  display:none;
  flex-wrap:wrap;
  gap:10px;
}

.submenu-slot.active{
  display:flex;
}

.submenu-btn{
  border:1px solid rgba(75,135,165,.24);
  background:rgba(5,26,37,.92);
  color:#dff3ff;
  padding:11px 14px;
  border-radius:12px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.submenu-btn.active{
  border-color:var(--accent-border);
  background:#082738;
}

.main{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(320px,.8fr);
  gap:18px;
}

.table-shell,
.matchday{
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(6,27,37,.96), rgba(4,20,28,.98));
  border-radius:18px;
  overflow:hidden;
}

.section-head{
  padding:18px;
}

.section-title{
  margin:0;
  font-size:18px;
  font-weight:900;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead th{
  padding:14px 16px;
  background:#041722;
  text-align:left;
}

tbody td{
  padding:14px 16px;
}

tbody tr:nth-child(odd) td{
  background:var(--row-a);
}

tbody tr:nth-child(even) td{
  background:var(--row-b);
}

.matchday-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.matchday-head{
  width:100%;
  border:none;
  background:transparent;
  color:#fff;
  padding:16px;
  cursor:pointer;
  text-align:left;
}

.matchday-body{
  display:none;
  padding:14px;
}

.matchday.open .matchday-body{
  display:block;
}

.footer{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.footer-btn,
.footer-link{
  border:1px solid rgba(75,135,165,.28);
  background:rgba(4,25,36,.96);
  color:#fff;
  border-radius:12px;
  min-height:46px;
  padding:0 16px;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(840px, 100%);
  background:#041924;
  border-radius:20px;
  overflow:hidden;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.modal-body{
  padding:18px;
}

@media (max-width:760px){

  .banner-nav,
  .submenu-row{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }

  .main{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body data-mode="Autodarts">

<div class="wrap">

<section class="hero-banner image-banner"></section>

<div class="top-nav-wrap">

<div class="banner-nav">

<button id="modeAutodarts" class="hero-action-btn hero-btn-autodarts active">
Autodarts
</button>

<button id="modeDartCounter" class="hero-action-btn hero-btn-dartcounter">
DartCounter
</button>

<a href="https://discord.gg/DEINLINK"
target="_blank"
class="hero-action-btn hero-btn-discord">
Discord
</a>

<button id="regelwerkBtn" class="hero-action-btn hero-btn-dark">
Regelwerk
</button>

</div>

<div class="submenu-row">
<div id="autodartsSubmenu" class="submenu-slot active"></div>
<div id="dartcounterSubmenu" class="submenu-slot"></div>
</div>

</div>

<section class="main">
<div id="tableArea"></div>
<aside>
<div id="matchdayArea" class="matchday-list"></div>
</aside>
</section>

<div class="footer">
<button id="openImpressumBtn" class="footer-btn">
Impressum
</button>

<a class="footer-link"
href="https://paypal.me/DEINLINK"
target="_blank">
Spenden
</a>
</div>

</div>

<div id="impressumModal" class="modal-backdrop">
<div class="modal">
<div class="modal-head">
<h3>Impressum</h3>
<button id="closeImpressumBtn">✕</button>
</div>

<div class="modal-body">
<p>Hier dein Impressum.</p>
</div>
</div>
</div>

<div id="regelwerkModal" class="modal-backdrop">
<div class="modal">
<div class="modal-head">
<h3>Regelwerk</h3>
<button id="closeRegelwerkBtn">✕</button>
</div>

<div id="regelwerkContent" class="modal-body">
<p>Lade Regelwerk...</p>
</div>
</div>
</div>

<script>

const SHEET_ID = "1P8aN20vfu6MLnMaEMXLv_OvOeXiF76-dAW1Fpy4DNe0";

const PLAYER_SHEET = "Spieler_Discord";
const RULES_SHEET = "Regelwerk";

const LEAGUES = [
  "Autodarts Liga 1",
  "Autodarts Liga 2",
  "Autodarts Liga 3",
  "Autodarts Liga 4",
  "Autodarts Liga 5",
  "Autodarts Liga 6",
  "DartCounter Liga 1",
  "DartCounter Liga 2",
  "DartCounter Liga 3",
  "DartCounter Liga 4",
  "DartCounter Liga 5",
  "DartCounter Liga 6"
];

const state = {
  leagues: [],
  leagueData: {},
  activeLeague: null,
  activeMode: "Autodarts"
};

const tableAreaEl = document.getElementById("tableArea");
const matchdayAreaEl = document.getElementById("matchdayArea");

function csvUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

async function loadCsv(sheetName){
  const response = await fetch(csvUrl(sheetName));
  return await response.text();
}

async function loadLeague(name){

  try{

    const csv = await loadCsv(name);

    return {
      standings: csv
    };

  }catch(e){

    return {
      standings: ""
    };

  }
}

async function loadAll(){

  tableAreaEl.innerHTML = `
    <div class="table-shell">
      <div class="section-head">
        <div class="section-title">Lade Liga...</div>
      </div>
    </div>
  `;

  const entries = await Promise.all(
    LEAGUES.map(async league => [
      league,
      await loadLeague(league)
    ])
  );

  state.leagueData = Object.fromEntries(entries);

  renderLeagueButtons();

}

function renderLeagueButtons(){

  const autodarts = LEAGUES.filter(l => l.startsWith("Autodarts"));

  const dartcounter = LEAGUES.filter(l => l.startsWith("DartCounter"));

  document.getElementById("autodartsSubmenu").innerHTML =
    autodarts.map(l =>
      `<button class="submenu-btn">${l}</button>`
    ).join("");

  document.getElementById("dartcounterSubmenu").innerHTML =
    dartcounter.map(l =>
      `<button class="submenu-btn">${l}</button>`
    ).join("");

}

document.getElementById("openImpressumBtn")
.addEventListener("click", () => {
  document.getElementById("impressumModal").classList.add("open");
});

document.getElementById("closeImpressumBtn")
.addEventListener("click", () => {
  document.getElementById("impressumModal").classList.remove("open");
});

document.getElementById("regelwerkBtn")
.addEventListener("click", () => {
  document.getElementById("regelwerkModal").classList.add("open");
});

document.getElementById("closeRegelwerkBtn")
.addEventListener("click", () => {
  document.getElementById("regelwerkModal").classList.remove("open");
});

loadAll();

</script>

</body>
</html>
